<html>
<head>
  <meta charset="UTF-8">
  <title>Main</title>

  <style>
    @font-face {
      font-family: "Alyamama";
      src: url("/asset/font/Alyamama-VariableFont_wght.ttf") format("truetype");
      font-style: normal;
      font-weight: 100 900;
    }

    body {
      margin: 0;
      font-family: "Alyamama", sans-serif;
    }

    /* Firefox */
    * {
      scrollbar-width: thin;
      scrollbar-color: #d9d9d9 transparent;
    }

    /* Chrome / Chromium / Safari */
    *::-webkit-scrollbar {
      width: 0.5rem;
      background: transparent;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background: #d9d9d9;
      border-radius: 1rem;
    }

    *::-webkit-scrollbar-thumb:hover {
      background: #d9d9d9;
    }
  </style>

  <script src="/build/main.js"></script>
</head>

<body>
  <div id="myapp"></div>

  <script>
    var app = Elm.Main.init({
      node: document.getElementById("myapp"),
      flags: {
        server_url: "http://localhost:5000/api/v1"
      }
    });
  </script>
</body>
</html>
